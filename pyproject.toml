[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logveil-shield"
version = "1.0.0"
description = "Share-safe log and config redactor: scrub secrets, tokens, and PII from logs before sharing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amir Hussain" }]
keywords = ["redaction", "secrets", "logs", "pii", "sanitize", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/aamirtechs/logveil-shield"
Issues = "https://github.com/aamirtechs/logveil-shield/issues"

[project.scripts]
logveil-shield = "logveil_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
